<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バス検索 | 次のバスを探す</title>
  <meta name="description" content="現在時刻から最も早く出発するバスを検索できます">
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    /* ===== ベース ===== */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      min-height: 100vh;
    }

    /* ===== ヘッダー ===== */
    .site-header {
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      color: #fff;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .site-header .bus-icon {
      font-size: 1.75rem;
      line-height: 1;
    }

    .site-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .site-header p {
      font-size: 0.75rem;
      opacity: 0.85;
      margin-top: 0.1rem;
    }

    /* ===== 現在時刻バー ===== */
    .current-time-bar {
      background: #e8f0fe;
      border-bottom: 1px solid #c5cae9;
      padding: 0.5rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: #3949ab;
    }

    .current-time-bar .clock-icon { font-size: 1rem; }
    #currentTime { font-weight: 700; font-size: 1rem; }

    /* ===== メインコンテンツ ===== */
    .main-content {
      max-width: 600px;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
    }

    /* ===== 検索フォーム ===== */
    .search-card {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 1.25rem;
    }

    .search-card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #1a73e8;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 700;
      color: #616161;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .form-group label .label-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.25rem;
      height: 1.25rem;
      border-radius: 50%;
      font-size: 0.6875rem;
      font-weight: 700;
      color: #fff;
    }

    .label-badge.departure { background: #1a73e8; }
    .label-badge.arrival   { background: #e53935; }

    .form-group select,
    .form-group input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      color: #2d3748;
      background: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-group select:focus,
    .form-group input[type="text"]:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
      background: #fff;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: "▼";
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      color: #9e9e9e;
      pointer-events: none;
    }

    /* 出発地⇄目的地 スワップボタン */
    .swap-row {
      display: flex;
      justify-content: center;
      margin: 0.5rem 0 1rem;
    }

    .swap-btn {
      background: #e8f0fe;
      border: none;
      border-radius: 50%;
      width: 2.25rem;
      height: 2.25rem;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
      color: #1a73e8;
    }

    .swap-btn:hover {
      background: #c5cae9;
      transform: rotate(180deg);
    }

    /* 検索ボタン */
    .search-btn {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.0625rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.04em;
    }

    .search-btn:hover { opacity: 0.9; }
    .search-btn:active { transform: scale(0.98); }

    /* ===== ローディング ===== */
    .loading {
      display: none;
      text-align: center;
      padding: 2rem;
      color: #757575;
    }

    .spinner {
      width: 2rem;
      height: 2rem;
      border: 3px solid #e3e3e3;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 0.75rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== エラー ===== */
    .error-box {
      display: none;
      background: #fff3f3;
      border: 1.5px solid #ef9a9a;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      color: #c62828;
      font-size: 0.9375rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .error-box.hidden { display: none !important; }

    /* ===== 結果エリア ===== */
    #resultArea { display: none; }

    .result-header {
      font-size: 0.8125rem;
      color: #757575;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .result-header strong { color: #2d3748; }

    /* バス結果カード */
    .bus-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      margin-bottom: 1rem;
      transition: transform 0.2s;
    }

    .bus-card:hover { transform: translateY(-2px); }

    .bus-card-header {
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      color: #fff;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .bus-card-header.next-bus {
      background: linear-gradient(135deg, #43a047 0%, #1b5e20 100%);
    }

    .bus-card-header.next-next-bus {
      background: linear-gradient(135deg, #fb8c00 0%, #e65100 100%);
    }

    .bus-card-badge {
      font-size: 0.6875rem;
      font-weight: 700;
      background: rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 0.2rem 0.65rem;
      letter-spacing: 0.03em;
    }

    .bus-card-route {
      font-size: 0.9375rem;
      font-weight: 700;
    }

    .bus-card-body {
      padding: 1.25rem;
    }

    .time-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .time-block {
      text-align: center;
      flex: 1;
    }

    .time-block .label {
      font-size: 0.6875rem;
      color: #9e9e9e;
      margin-bottom: 0.1rem;
    }

    .time-block .time {
      font-size: 2rem;
      font-weight: 700;
      color: #1a73e8;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .time-block .time.arrival { color: #e53935; }

    .time-arrow {
      font-size: 1.25rem;
      color: #bdbdbd;
      flex-shrink: 0;
    }

    .duration-badge {
      font-size: 0.6875rem;
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 20px;
      padding: 0.15rem 0.6rem;
      font-weight: 700;
      white-space: nowrap;
      align-self: flex-end;
      margin-bottom: 0.25rem;
    }

    /* 詳細情報グリッド */
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      border-top: 1px solid #f0f0f0;
      padding-top: 1rem;
    }

    .detail-item {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
    }

    .detail-item .d-label {
      font-size: 0.6875rem;
      color: #9e9e9e;
      margin-bottom: 0.15rem;
    }

    .detail-item .d-value {
      font-size: 0.9375rem;
      font-weight: 700;
      color: #2d3748;
    }

    .detail-item .d-value.highlight { color: #1a73e8; }

    /* 残り時間バー */
    .countdown {
      background: #e8f0fe;
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      margin-top: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: #3949ab;
    }

    .countdown strong {
      font-size: 1.0625rem;
      color: #1a73e8;
    }

    /* ===== 次の便ボタン ===== */
    .next-bus-btn {
      width: 100%;
      padding: 0.85rem;
      background: #fff;
      color: #1a73e8;
      border: 2px solid #1a73e8;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s, color 0.2s;
      margin-bottom: 0.75rem;
      letter-spacing: 0.03em;
    }

    .next-bus-btn:hover {
      background: #e8f0fe;
    }

    .next-bus-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== 「バスなし」表示 ===== */
    .no-bus-box {
      background: #fff;
      border-radius: 16px;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .no-bus-box .icon { font-size: 3rem; margin-bottom: 0.5rem; }
    .no-bus-box p { color: #757575; font-size: 0.9375rem; }

    /* ===== フッター ===== */
    .site-footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.75rem;
      color: #9e9e9e;
    }

    /* ===== レスポンシブ（PC幅） ===== */
    @media (min-width: 640px) {
      .main-content { padding-top: 2rem; }

      .search-card { padding: 2rem; }

      .time-block .time { font-size: 2.5rem; }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <span class="bus-icon">🚌</span>
    <div>
      <h1>バス時刻検索</h1>
      <p>現在時刻から最も早い便を表示します</p>
    </div>
  </header>

  <!-- 現在時刻バー -->
  <div class="current-time-bar">
    <span class="clock-icon">🕐</span>
    <span>現在時刻：</span>
    <span id="currentTime">--:--:--</span>
  </div>

  <!-- メインコンテンツ -->
  <main class="main-content">

    <!-- 検索フォーム -->

        <label for="departure">
          <span class="label-badge departure">出</span>
          出発地
        </label>
        <div class="select-wrapper">
          <select id="departure">
            <option value="">-- 出発地を選択 --</option>
            <option value="中央駅">中央駅</option>
            <option value="北口バスターミナル">北口バスターミナル</option>
            <option value="市民病院前">市民病院前</option>
            <option value="公園通り">公園通り</option>
            <option value="南駅">南駅</option>
          </select>
        </div>
      </div>

      <!-- 出発⇄目的地スワップ -->
      <div class="swap-row">
        <button class="swap-btn" id="swapBtn" title="出発地と目的地を入れ替え" aria-label="入れ替え">⇅</button>
      </div>

      <!-- 目的地 -->
      <div class="form-group">
        <label for="destination">
          <span class="label-badge arrival">着</span>
          目的地
        </label>
        <div class="select-wrapper">
          <select id="destination">
            <option value="">-- 目的地を選択 --</option>
            <option value="中央駅">中央駅</option>
            <option value="北口バスターミナル">北口バスターミナル</option>
            <option value="市民病院前">市民病院前</option>
            <option value="公園通り">公園通り</option>
            <option value="南駅">南駅</option>
          </select>
        </div>
      </div>

      <!-- 検索ボタン -->
      <button class="search-btn" id="searchBtn">
        🚌 この時刻以降のバスを検索
      </button>
    </div>

    <!-- エラーボックス -->
    <div class="error-box hidden" id="errorBox">
      <span>⚠️</span>
      <span id="errorMessage"></span>
    </div>

    <!-- ローディング -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>検索中...</p>
    </div>

    <!-- 結果エリア -->
    <div id="resultArea">
      <div class="result-header" id="resultHeader"></div>
      <div id="busCards"></div>
      <button class="next-bus-btn" id="nextBusBtn">
        ➕ 次の便も見る
      </button>
    </div>

  </main>

    ];

    // =============================================
    //  ユーティリティ
    // =============================================

    /** "HH:MM" → 分（0:00 = 0） */
    function timeToMinutes(t) {
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    }

    /** 現在時刻を "HH:MM" で返す */
    function getNowHHMM() {
      const d = new Date();
      const h = String(d.getHours()).padStart(2, "0");
      const m = String(d.getMinutes()).padStart(2, "0");
      return `${h}:${m}`;
    }

    /** 現在時刻を "HH:MM:SS" で返す */
    function getNowHHMMSS() {
      const d = new Date();
      const h = String(d.getHours()).padStart(2, "0");
      const m = String(d.getMinutes()).padStart(2, "0");
      const s = String(d.getSeconds()).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    /** 残り分数 → "XX分後" 文字列 */
    function minutesLabel(diffMin) {
      if (diffMin <= 0) return "まもなく出発";
      if (diffMin < 60) return `${diffMin}分後`;
      const h = Math.floor(diffMin / 60);
      const m = diffMin % 60;
      return m === 0 ? `${h}時間後` : `${h}時間${m}分後`;
    }

    /** 乗車時間を計算する（分） */
    function rideMinutes(dep, arr) {
      const d = timeToMinutes(dep);
      const a = timeToMinutes(arr);
      return a >= d ? a - d : (a + 1440) - d;
    }

    // =============================================
    //  検索ロジック
    // =============================================

    /**
     * 指定の出発地・目的地に対して、
     * 現在時刻以降の便を時刻順で最大 maxCount 件返す
     */
    function searchBuses(from, to, maxCount = 5) {
      const nowMin = timeToMinutes(getNowHHMM());
      const results = [];

      for (const line of TIMETABLE) {
        if (line.from !== from || line.to !== to) continue;
        for (const dep of line.departures) {
          if (timeToMinutes(dep.dep) >= nowMin) {
            results.push({
              route:    line.route,
              platform: line.platform,
              dep:      dep.dep,
              arr:      dep.arr,
              diffMin:  timeToMinutes(dep.dep) - nowMin,
            });
          }
        }
      }

      // 出発時刻昇順でソート
      results.sort((a, b) => timeToMinutes(a.dep) - timeToMinutes(b.dep));
      return results.slice(0, maxCount);
    }

    // =============================================
    //  UI 操作
    // =============================================

    let currentResults = [];
    let shownCount = 0;
    const SHOW_STEP = 1; // 最初は1件、次の便ボタンで1件ずつ追加

    function showError(msg) {
      const box = document.getElementById("errorBox");
      document.getElementById("errorMessage").textContent = msg;
      box.classList.remove("hidden");
      box.style.display = "flex";
      document.getElementById("resultArea").style.display = "none";
      document.getElementById("loading").style.display = "none";
    }

    function hideError() {
      const box = document.getElementById("errorBox");
      box.classList.add("hidden");
      box.style.display = "none";
    }

    /** バスカードのHTMLを生成する */
    function buildCard(bus, index) {
      const badgeLabels = ["🚌 次のバス", "🟢 次々のバス", "🟠 その次のバス", "🔵 さらに次", "📋 他の便"];
      const headerClasses = ["", "next-bus", "next-next-bus", "next-bus", "next-next-bus"];
      const badge = badgeLabels[index] || `${index + 1}番目の便`;
      const headerClass = headerClasses[index] || "";
      const ride = rideMinutes(bus.dep, bus.arr);

      return `
        <div class="bus-card">
          <div class="bus-card-header ${headerClass}">
            <span class="bus-card-badge">${badge}</span>
            <span class="bus-card-route">${bus.route}</span>
          </div>
          <div class="bus-card-body">
            <div class="time-row">
              <div class="time-block">
                <div class="label">出発</div>
                <div class="time">${bus.dep}</div>
              </div>
              <div class="time-arrow">→</div>
              <div class="time-block">
                <div class="label">到着</div>
                <div class="time arrival">${bus.arr}</div>
              </div>
              <div class="duration-badge">乗車 約${ride}分</div>
            </div>
            <div class="detail-grid">
              <div class="detail-item">
                <div class="d-label">🅿 乗り場</div>
                <div class="d-value highlight">${bus.platform}</div>
              </div>
              <div class="detail-item">
                <div class="d-label">⏱ 出発まで</div>
                <div class="d-value">${minutesLabel(bus.diffMin)}</div>
              </div>
            </div>
            <div class="countdown">
              ⏰ <span>出発まであと <strong>${minutesLabel(bus.diffMin)}</strong></span>
            </div>
          </div>
        </div>
      `;
    }

    function renderCards() {
      const container = document.getElementById("busCards");
      container.innerHTML = "";
      for (let i = 0; i < shownCount; i++) {
        container.insertAdjacentHTML("beforeend", buildCard(currentResults[i], i));
      }
      // 「次の便」ボタンの状態
      const btn = document.getElementById("nextBusBtn");
      if (shownCount >= currentResults.length) {
        btn.disabled = true;
        btn.textContent = "✅ 本日の便はすべて表示しました";
      } else {
        btn.disabled = false;
        btn.innerHTML = `➕ 次の便も見る（残り ${currentResults.length - shownCount} 件）`;
      }
    }

    function doSearch() {
      const from = document.getElementById("departure").value;
      const to   = document.getElementById("destination").value;
      hideError();

      if (!from) { showError("出発地を選択してください。"); return; }
      if (!to)   { showError("目的地を選択してください。"); return; }
      if (from === to) { showError("出発地と目的地が同じです。別の場所を選択してください。"); return; }

      // ローディング表示
      document.getElementById("loading").style.display = "block";
      document.getElementById("resultArea").style.display = "none";

      // 少し遅延させて「検索中」感を演出
      setTimeout(() => {
        currentResults = searchBuses(from, to, 10);
        document.getElementById("loading").style.display = "none";

        const header = document.getElementById("resultHeader");
        header.innerHTML = `<strong>${from}</strong> → <strong>${to}</strong> の検索結果`;

        if (currentResults.length === 0) {
          document.getElementById("busCards").innerHTML = `
            <div class="no-bus-box">
              <div class="icon">🌙</div>
              <p>本日のバスは終了しています。<br>明日の運行をお待ちください。</p>
            </div>`;
          document.getElementById("nextBusBtn").style.display = "none";
        } else {
          shownCount = 1;
          document.getElementById("nextBusBtn").style.display = "flex";
          renderCards();
        }

        document.getElementById("resultArea").style.display = "block";
        document.getElementById("resultArea").scrollIntoView({ behavior: "smooth", block: "start" });
      }, 400);
    }

    // =============================================
    //  イベント登録
    // =============================================

    document.getElementById("searchBtn").addEventListener("click", doSearch);

    document.getElementById("nextBusBtn").addEventListener("click", () => {
      if (shownCount < currentResults.length) {
        shownCount++;
        renderCards();
      }
    });

    document.getElementById("swapBtn").addEventListener("click", () => {
      const dep = document.getElementById("departure");
      const arr = document.getElementById("destination");
      const tmp = dep.value;
      dep.value = arr.value;
      arr.value = tmp;
    });

    // Enterキーでも検索
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doSearch();
    });

    // =============================================
    //  時計の更新（1秒ごと）
    // =============================================
    function updateClock() {
      document.getElementById("currentTime").textContent = getNowHHMMSS();
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ページロード時に現在時刻をもとにカウントダウン更新（表示されているカードがあれば）
    setInterval(() => {
      if (shownCount > 0 && currentResults.length > 0) {
        const nowMin = timeToMinutes(getNowHHMM());
        currentResults = currentResults.map(b => ({
          ...b,
          diffMin: timeToMinutes(b.dep) - nowMin,
        })).filter(b => b.diffMin >= 0);
        if (currentResults.length === 0) {
          document.getElementById("busCards").innerHTML = `
            <div class="no-bus-box">
              <div class="icon">🏁</div>
              <p>検索結果の便がすべて出発しました。<br>再度検索してください。</p>
            </div>`;
          document.getElementById("nextBusBtn").style.display = "none";
        } else {
          shownCount = Math.min(shownCount, currentResults.length);
          renderCards();
        }
      }
    }, 60000); // 1分ごとにリフレッシュ
  </script>

</body>
</html>
